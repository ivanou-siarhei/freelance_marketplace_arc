services:
  postgres:
    image: postgres:18-alpine
    container_name: arcwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arcwork
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18 images keep the cluster under /var/lib/postgresql, not /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arcwork"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
